name: release

# Ships, per release (and to the `edge` pre-release on manual dispatch):
#
#   tifa-label-windows-x64.zip        Windows GUI bundle (Electron + engine
#                                     + Q4_0 model + dictionaries)
#   tifa-cli-<platform>-full.tar.gz   CLI bundle, full-precision F16 model
#   tifa-cli-<platform>-q4.tar.gz     CLI bundle, Q4_0 (smallest) model
#                                     <platform> = windows-x64 | linux-x64 | macos-arm64
#
# Two sibling CLI packages per platform follow the game.cpp convention: the
# same binaries with different weights, so a host can pick precision per
# install.  Triggered by a v* tag or manually (workflow_dispatch -> `edge`).

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Convert the checkpoint once; every platform bundle reuses these artifacts.
  # ---------------------------------------------------------------------------
  convert-model:
    name: convert TIFA-1.0-ST (F16 + Q4_0)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install conversion deps
        run: pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu && pip install --quiet numpy pyyaml gguf onnx

      - name: Download the TIFA-1.0-ST checkpoint
        run: |
          curl -sL -o TIFA-1.0-ST.zip \
            https://github.com/openvpi/TIFA/releases/download/v1.0.0/TIFA-1.0-ST.zip
          unzip -q TIFA-1.0-ST.zip -d model_src

      - name: Convert to F16 (full precision)
        run: |
          python scripts/convert_tifa_to_gguf.py \
            --model-dir model_src/TIFA-1.0-ST \
            -o tifa-1.0-st-f16.gguf --dtype f16

      - name: Convert to Q4_0 (smallest)
        run: |
          python scripts/convert_tifa_to_gguf.py \
            --model-dir model_src/TIFA-1.0-ST \
            -o tifa-1.0-st-q4_0.gguf --dtype f16 \
            --quant-config scripts/quant_q4_all.json

      - name: Download the BreathLab source zip (published on the edge release)
        # Tolerant: the zip is a model-source upload, not a repo file.  When it
        # is missing the bundles simply ship without a breath model and the
        # quick-start keeps pointing at scripts/convert_breath_to_gguf.py.
        continue-on-error: true
        run: |
          curl -sL -o breathlab.zip             https://github.com/${{ github.repository }}/releases/download/edge/breathLab_models_dml.zip
          unzip -q -o breathlab.zip -d breathlab_src

      - name: Convert the breath/AP detector (FBL)
        continue-on-error: true
        run: |
          python scripts/convert_breath_to_gguf.py             --model-dir breathlab_src/models_dml --name v5_24k             -o breath-v5-24k-f16.gguf
          ls -la breath-v5-24k-f16.gguf

      - name: Convert the English LSTM G2P (OOV inference for the en converter)
        run: |
          python scripts/convert_lstm_g2p_to_gguf.py             --model-dir model_src/TIFA-1.0-ST/assets/LstmG2p-Eng             -o lstm-g2p-eng.gguf

      - name: Verify the two differ in size (quantization actually applied)
        run: |
          F16=$(stat -c%s tifa-1.0-st-f16.gguf)
          Q4=$(stat -c%s tifa-1.0-st-q4_0.gguf)
          echo "f16=$F16 q4_0=$Q4"
          test "$Q4" -lt "$F16"

      - uses: actions/upload-artifact@v4
        with:
          name: tifa-models
          path: |
            tifa-1.0-st-f16.gguf
            tifa-1.0-st-q4_0.gguf
            lstm-g2p-eng.gguf
            breath-v5-24k-f16.gguf
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Per-platform CLI bundles (full + Q4) with the best backend each supports:
  # Windows/Linux -> Vulkan, macOS -> Metal (CPU always compiled in).
  # ---------------------------------------------------------------------------
  cli-bundles:
    name: ${{ matrix.name }} CLI bundles
    needs: convert-model
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            cmake_extra: "-DTIFA_GGML_VULKAN=ON"
            bin: build/bin/tifa_ggml_cli.exe
            libs: "build/bin/*.dll"
          - os: ubuntu-latest
            name: linux-x64
            cmake_extra: "-DTIFA_GGML_VULKAN=ON"
            bin: build/bin/tifa_ggml_cli
            libs: "build/bin/*.so*"
          - os: macos-14
            name: macos-arm64
            cmake_extra: "-DTIFA_GGML_METAL=ON -DCMAKE_OSX_ARCHITECTURES=arm64"
            bin: build/bin/tifa_ggml_cli
            libs: "build/bin/*.dylib"

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          curl.exe -sL -o "$env:RUNNER_TEMP/vulkan-sdk.exe" `
            https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe
          & "$env:RUNNER_TEMP/vulkan-sdk.exe" --accept-licenses --default-answer --confirm-command install
          $sdk = Get-ChildItem C:\VulkanSDK -Directory |
            Sort-Object Name | Select-Object -Last 1
          if (-not $sdk) { throw "Vulkan SDK installer produced no C:\VulkanSDK\<version> directory" }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH

      - name: Install Vulkan SDK (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libvulkan-dev glslc spirv-headers spirv-tools

      - name: Configure
        run: |
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DTIFA_GGML_BUILD_CLI=ON \
                -DTIFA_GGML_BUILD_TESTS=OFF \
                ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --parallel 4 --config Release

      - name: Download models
        uses: actions/download-artifact@v4
        with:
          name: tifa-models

      - name: Assemble the two bundles
        run: |
          set -euo pipefail
          for PREC in full q4; do
            if [ "$PREC" = "full" ]; then MODEL=tifa-1.0-st-f16.gguf; else MODEL=tifa-1.0-st-q4_0.gguf; fi
            PKG="tifa-cli-${{ matrix.name }}-$PREC"
            mkdir -p "$PKG/models"
            cp "${{ matrix.bin }}" "$PKG/"
            # shellcheck disable=SC2086
            cp ${{ matrix.libs }} "$PKG/" 2>/dev/null || true
            cp "$MODEL" "$PKG/models/tifa.gguf"
            # G2P dictionaries: the GGUF's g2p config resolves @dictionaries/x
            # against the model directory, so the flat tables must sit under
            # models/dictionaries/ and the cpp-pinyin engine under
            # models/cpp_pinyin/ -- a flat copy into models/ leaves every
            # lookup pointing at nothing.
            mkdir -p "$PKG/models/dictionaries" "$PKG/models/assets"
            cp dicts/*.txt "$PKG/models/dictionaries/"
            cp -r dicts/cpp_pinyin "$PKG/models/" 2>/dev/null || true
            # The English converter's model_path is @assets/LstmG2p-Eng; the
            # converted GGUF lands beside that name so it resolves.
            cp lstm-g2p-eng.gguf "$PKG/models/assets/LstmG2p-Eng.gguf" 2>/dev/null || true
            # FBL breath model, converted from the BreathLab source zip that
            # ships beside these bundles (absent when that download failed).
            cp breath-v5-24k-f16.gguf "$PKG/models/" 2>/dev/null || true
            cp docs/usage.md "$PKG/USAGE.md"
            cat > "$PKG/README.txt" <<EOF
          tifa_ggml_cli -- TIFA forced aligner (see the repository README)
          Bundled model: $MODEL ($PREC precision), dictionaries under models/.

          Quick start:
            tifa_ggml_cli align song.wav -m models/tifa.gguf --text-file song.txt -o out
            tifa_ggml_cli breathe song.wav -m models/breath-v5-24k-f16.gguf --merge out -o out
            tifa_ggml_cli align song.wav -m models/tifa.gguf --textgrid out -o out2

          The breathe/2PASS steps need the FBL breath model; when this bundle has
          no models/breath-*.gguf, convert it from the BreathLab source zip that
          is published next to this archive:
            python scripts/convert_breath_to_gguf.py --model-dir models_dml --name v5_24k -o breath.gguf

          The full workflow (TIFA -> FBL -> 2PASS) is documented in
          docs/dataset-workflow.md.
          EOF
            tar -czf "$PKG.tar.gz" "$PKG"
            ls -la "$PKG.tar.gz"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-cli-bundles
          path: tifa-cli-${{ matrix.name }}-*.tar.gz
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Windows GUI bundle (TIFA Label): Electron app + engine + Q4 model +
  # dictionaries, as a single zip.  Also ships the full-precision bundle as a
  # sibling download for hosts that want the bigger weights.
  # ---------------------------------------------------------------------------
  windows-gui:
    name: windows-x64 GUI bundle
    needs: convert-model
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          curl.exe -sL -o "$env:RUNNER_TEMP/vulkan-sdk.exe" `
            https://sdk.lunarg.com/sdk/download/latest/windows/vulkan-sdk.exe
          & "$env:RUNNER_TEMP/vulkan-sdk.exe" --accept-licenses --default-answer --confirm-command install
          $sdk = Get-ChildItem C:\VulkanSDK -Directory |
            Sort-Object Name | Select-Object -Last 1
          if (-not $sdk) {
            throw "Vulkan SDK installer produced no C:\VulkanSDK\<version> directory"
          }
          "VULKAN_SDK=$($sdk.FullName)" >> $env:GITHUB_ENV
          "$($sdk.FullName)\Bin" >> $env:GITHUB_PATH

      - name: Configure
        run: >
          cmake -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DTIFA_GGML_VULKAN=ON
          -DTIFA_GGML_BUILD_CLI=ON
          -DTIFA_GGML_BUILD_TESTS=OFF

      - name: Build engine
        run: cmake --build build --config Release

      - name: Download models
        uses: actions/download-artifact@v4
        with:
          name: tifa-models

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build the Electron app
        working-directory: ui
        run: |
          npm ci
          npx electron-builder --win --dir

      - name: Assemble the bundle
        shell: pwsh
        run: |
          $root = "bundle/tifa-label"
          New-Item -ItemType Directory -Force -Path $root | Out-Null

          # Electron app (unpacked) at the top level ...
          Copy-Item -Recurse -Force "ui/dist/win-unpacked/*" $root

          # ... the engine beside it, where the UI looks for it ...
          Copy-Item -Force build/bin/tifa_ggml_cli.exe $root
          Copy-Item -Force build/bin/*.dll $root

          # ... and the model + dictionaries under models/.
          New-Item -ItemType Directory -Force -Path "$root/models/dictionaries" | Out-Null
          New-Item -ItemType Directory -Force -Path "$root/models/assets" | Out-Null
          Copy-Item -Force tifa-1.0-st-q4_0.gguf "$root/models/"
          # @dictionaries/... resolves against the model directory; the engine
          # tables live under cpp_pinyin/ beside it.
          Copy-Item -Force dicts/*.txt "$root/models/dictionaries/"
          Copy-Item -Recurse -Force dicts/cpp_pinyin "$root/models/"
          # English OOV model (model_path @assets/LstmG2p-Eng in the GGUF).
          Copy-Item -Force lstm-g2p-eng.gguf "$root/models/assets/LstmG2p-Eng.gguf"
          # FBL breath model (absent when the source download failed).
          if (Test-Path breath-v5-24k-f16.gguf) {
            Copy-Item -Force breath-v5-24k-f16.gguf "$root/models/"
          }

          Copy-Item -Force docs/usage.md "$root/USAGE.md"
          @"
          TIFA Label - quick start (dataset annotation)
          =============================================
          1. Run "TIFA Label.exe".
          2. Pick the aligner model:  models/tifa-1.0-st-q4_0.gguf
             (the G2P dictionaries next to it are picked up automatically).
             For the breath/2PASS stages pick the bundled breath model:
             models/breath-v5-24k-f16.gguf (if missing, convert the BreathLab
             source zip published beside this archive:
             scripts/convert_breath_to_gguf.py).
          3. Import audio files or a folder, choose the annotation source
             (text/G2P or existing phones), enable the breath/2PASS stages,
             then run.  TextGrids land in the output directory.

          tifa_ggml_cli.exe is the engine; `tifa_ggml_cli.exe --help` lists the
          CLI options (align / inspect / breathe).
          "@ | Set-Content "$root/README.txt"

          Compress-Archive -Path "$root/*" -DestinationPath tifa-label-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tifa-label-windows-x64
          path: tifa-label-windows-x64.zip
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Publish everything to the release (tag) or the `edge` pre-release.
  # ---------------------------------------------------------------------------
  publish:
    name: publish
    needs: [cli-bundles, windows-gui]
    runs-on: ubuntu-latest
    steps:
      - name: Collect CLI bundles
        uses: actions/download-artifact@v4
        with:
          path: dist-cli
          pattern: "*-cli-bundles"

      - name: Collect GUI bundle
        uses: actions/download-artifact@v4
        with:
          path: dist-gui
          pattern: "tifa-label-*"

      - name: Flatten
        run: |
          mkdir -p out
          find dist-cli dist-gui -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} out/ \;
          ls -la out/

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'edge' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'edge build' }}
          files: out/*
          generate_release_notes: true
          prerelease: ${{ github.ref_type != 'tag' }}
