name: cuda

# CUDA lives on its own schedule: the full game.cpp-style SASS+PTX arch list
# costs tens of minutes per target to compile, and the hosted runners have no
# NVIDIA driver so the binaries cannot even be executed there (the jobs prove
# compilation only).  Keeping it out of ci.yml means a slow or broken CUDA
# build never blocks the main matrix; failures here are informational.
#
# Triggers: nightly, manual, and release tags (so a tag always gets a fresh
# CUDA compile attempt next to the shipped bundles).  On a tag this job runs
# beside the release workflow rather than inside it: the release publishes as
# soon as the CPU/Vulkan/Metal bundles are ready, and the CUDA packages are
# attached to that same release once this job finishes, hours later.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release to attach the packages to (default: the tag that triggered this run)'
        required: false
        type: string
  schedule:
    # Nightly, off the hour to avoid the cron stampede.
    - cron: '17 3 * * *'
  push:
    tags: ['v*']

permissions:
  contents: write    # attach the bundles to the release on a tag
  actions: read      # read the converted models from the release run

jobs:
  build-cuda:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Which release the packages belong to: the dispatch input when given (so a
    # failed CUDA build can be retried hours later without re-tagging), else the
    # tag that triggered the run.  Empty on the nightly -> nothing is published.
    env:
      RELEASE_TAG: ${{ inputs.release_tag != '' && inputs.release_tag || (github.ref_type == 'tag' && github.ref_name || '') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x64-cuda
          - os: windows-2022
            name: windows-x64-cuda

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA Toolkit (Linux)
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: "12.9.0"
          method: network
          log-file-suffix: "${{ matrix.name }}.txt"

      - name: Install CUDA Toolkit (Windows)
        if: runner.os == 'Windows'
        uses: Jimver/cuda-toolkit@v0.2.29
        with:
          cuda: "12.9.0"
          method: network
          sub-packages: '["nvcc", "cudart", "cublas", "cublas_dev", "visual_studio_integration"]'
          log-file-suffix: "${{ matrix.name }}.txt"

      - name: Verify CUDA compiler
        run: nvcc --version

      - name: Cache CMake FetchContent
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ matrix.name }}-deps-v1-${{ hashFiles('cmake/Dependencies.cmake') }}
          restore-keys: |
            ${{ matrix.name }}-deps-v1-

      - name: Configure
        run: |
          cmake -S . -B build \
                -DCMAKE_BUILD_TYPE=Release \
                -DTIFA_GGML_BUILD_CLI=ON \
                -DTIFA_GGML_BUILD_TESTS=OFF \
                -DTIFA_GGML_CUDA=ON \
                -DGGML_NATIVE=OFF \
                -DCMAKE_CUDA_ARCHITECTURES="75;80;86;89;90;120-virtual"

      - name: Build
        # nvcc expands dozens of template instances per file; cap parallelism
        # so the runner's memory survives (same policy as game.cpp).
        run: cmake --build build --parallel 2 --config Release

      - name: Version smoke
        run: |
          set -euo pipefail
          ls -la build/bin/
          if [ "${{ runner.os }}" = "Windows" ]; then
            # ggml-cuda.dll imports nvcuda.dll (the NVIDIA driver), which the
            # hosted runner does not have; startup is impossible there.
            echo "no NVIDIA driver on this runner; compile is the verification"
          else
            build/bin/tifa_ggml_cli --version || echo "startup needs the driver; compile is the verification"
          fi

      - name: Fetch the converted models (from this commit's release run)
        # The release workflow converts the checkpoint once; reuse those models
        # so a CUDA package has the same layout as the other bundles instead of
        # being an engine with nothing to run.  Tolerant: when the fetch fails
        # the package falls back to the engine-only shape it used to have.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # When a target release is known, the release run starts at the same
          # time as this one, so give its model artifacts time to appear.  On
          # the nightly there is normally no release run at all, so try once and
          # move on rather than waiting out the whole window.
          TRIES=1
          if [ -n "$RELEASE_TAG" ]; then TRIES=40; fi
          for i in $(seq 1 "$TRIES"); do
            if [ -n "$RELEASE_TAG" ]; then
              # The release run's head_branch is the tag name.
              RUN=$(gh run list --workflow release.yml --branch "$RELEASE_TAG" \
                      --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            else
              RUN=$(gh run list --workflow release.yml --commit "$GITHUB_SHA" \
                      --json databaseId --jq '.[0].databaseId' 2>/dev/null || true)
            fi
            if [ -n "$RUN" ] && gh run download "$RUN" -n tifa-models -D models_out 2>/dev/null; then
              echo "models <- release run $RUN"
              break
            fi
            echo "waiting for the release run's model artifacts ($i/$TRIES)"
            sleep 30
          done
          ls -la models_out 2>/dev/null || echo "no models; packaging the engine only"

      - name: Package
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            ENGINE=tifa_ggml_cli.exe
            LIBS=$(find build/bin -maxdepth 1 -name '*.dll')
          else
            ENGINE=tifa_ggml_cli
            LIBS=$(find build/bin -maxdepth 1 -name '*.so*')
          fi

          # The matrix name already ends in -cuda, so strip it before building
          # the asset name -- otherwise it reads tifa-cuda-linux-x64-cuda-full.
          PLATFORM="${{ matrix.name }}"; PLATFORM="${PLATFORM%-cuda}"

          BASE="tifa_ggml-${{ matrix.name }}"
          mkdir -p "$BASE"
          cp "build/bin/$ENGINE" "$BASE/"
          for f in $LIBS; do cp "$f" "$BASE/"; done

          if [ ! -f models_out/tifa-1.0-st-q4_0.gguf ]; then
            # No models: ship the engine alone, as before.
            tar -czf "dist/$BASE.tar.gz" "$BASE"
          else
            for PREC in full q4; do
              if [ "$PREC" = "full" ]; then MODEL=tifa-1.0-st-f16.gguf; else MODEL=tifa-1.0-st-q4_0.gguf; fi
              B="tifa-cuda-$PLATFORM-$PREC"
              rm -rf "$B"; cp -r "$BASE" "$B"
              # Same layout the release bundles use: the GGUF's @dictionaries/
              # and @assets/ paths resolve against models/.
              mkdir -p "$B/models/dictionaries" "$B/models/assets"
              cp "models_out/$MODEL" "$B/models/tifa.gguf"
              cp dicts/*.txt "$B/models/dictionaries/"
              cp -r dicts/cpp_pinyin "$B/models/" 2>/dev/null || true
              cp models_out/lstm-g2p-eng.gguf "$B/models/assets/LstmG2p-Eng.gguf" 2>/dev/null || true
              cp models_out/breath-v5-24k-f16.gguf "$B/models/" 2>/dev/null || true
              cp docs/usage.md "$B/USAGE.md"
              tar -czf "dist/$B.tar.gz" "$B"
            done
          fi
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}-bundle
          path: dist/*.tar.gz
          retention-days: 14

      - name: Attach the CUDA packages to the release
        # The release is already published by now (it does not wait for CUDA);
        # this appends the CUDA packages to it.  Skipped on the nightly, where
        # there is no release to attach to.
        if: env.RELEASE_TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: dist/*.tar.gz
          fail_on_unmatched_files: true
